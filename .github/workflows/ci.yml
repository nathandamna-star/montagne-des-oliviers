# Vérification automatique à chaque envoi de code sur GitHub.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App Flutter (analyse, tests, version web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
